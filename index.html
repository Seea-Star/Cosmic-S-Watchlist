<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Watchlist</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .filter-btn {
      background: #ffffff;
      color: #111111;
      border: 2px solid #111111;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #111111;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111111;
      background: #F3EEDA;
    }

    .filter-btn.active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #111111;
      background: #F3EEDA;
    }

    .watchlist-scroll-area { 
      max-height: 600px; 
      overflow-y: auto; 
      padding-right: 5px;
    }

    .watchlist-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .watchlist-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .watchlist-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    /* Gestione delle sezioni */
    .watchlist-section {
      display: none;
    }

    .watchlist-section.active-section {
      display: block;
    }

    .watchlist-grid {
      column-count: 3;
      column-gap: 20px;
    }

    @media (max-width: 768px) {
      .watchlist-grid {
        column-count: 1;
      }
    }

    .watchlist-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      display: inline-block;
      width: 100%;
    }

    .watchlist-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      -webkit-touch-callout: none;
      pointer-events: auto;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>WATCHLIST</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;"><- HOME</a>
    </header>

    <!-- Bottoni -->
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="showSection('all', event)">ALL</button>
      <button class="filter-btn" onclick="showSection('anime', event)">ANIME</button>
      <button class="filter-btn" onclick="showSection('films', event)">FILMS</button>
      <button class="filter-btn" onclick="showSection('series', event)">SERIES</button>
      <button class="filter-btn" onclick="showSection('books', event)">BOOKS</button>
    </div>

    <div class="watchlist-scroll-area">
      
      <!-- 1. SEZIONE ALL (Tutto insieme) -->
      <div id="section-all" class="watchlist-section active-section">
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./watchlist-01.png" alt="Naruto" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-06.png" alt="Spy x Family" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-02.png" alt="Spy x Family" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-05.png" alt="Film" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-03.png" alt="Saiki K" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-04.png" alt="Attack on Titan" class="watchlist-img" oncontextmenu="return false;"></div>
        </div>
      </div>

      <!-- 2. SEZIONE ANIME -->
      <div id="section-anime" class="watchlist-section">
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./watchlist-01.png" alt="Naruto" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-02.png" alt="Spy x Family" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-03.png" alt="Saiki K" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-04.png" alt="Attack on Titan" class="watchlist-img" oncontextmenu="return false;"></div>
        </div>
      </div>

      <!-- 3. SEZIONE FILMS -->
      <div id="section-films" class="watchlist-section">
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./watchlist-06.png" alt="Spy x Family" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-05.png" alt="Film" class="watchlist-img" oncontextmenu="return false;"></div>
        </div>
      </div>

      <!-- 4. SEZIONE SERIES -->
      <div id="section-series" class="watchlist-section">
        <div class="watchlist-grid">
          <!-- Aggiungi qui le serie -->
        </div>
      </div>

      <!-- 5. SEZIONE BOOKS -->
      <div id="section-books" class="watchlist-section">
        <div class="watchlist-grid">
          <!-- Aggiungi qui i libri -->
        </div>
      </div>

    </div>

  </div>

  <script>
    function showSection(sectionName, event) {
      // Nascondi tutte le sezioni
      const sections = document.getElementsByClassName('watchlist-section');
      for (let sec of sections) {
        sec.classList.remove('active-section');
      }

      // Rimuovi la classe active da tutti i bottoni
      const buttons = document.getElementsByClassName('filter-btn');
      for (let btn of buttons) {
        btn.classList.remove('active');
      }

      // Mostra la sezione selezionata e illumina il rispettivo bottone
      document.getElementById('section-' + sectionName).classList.add('active-section');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
