<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC-S - Watchlist</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f5f5f7;
      background-image: 
        linear-gradient(#e1e1e6 1px, transparent 1px),
        linear-gradient(90deg, #e1e1e6 1px, transparent 1px);
      background-size: 20px 20px;
      color: #111111;
      font-family: 'Quicksand', sans-serif;
      padding: 30px 10px;
      display: flex;
      justify-content: center;
    }

    .site-wrapper {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .top-banner {
      background: #111111;
      border: 2px solid #111111;
      border-radius: 20px;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 4px 4px 0px #111111;
    }

    .top-banner h1 { 
      font-size: 2rem; 
      font-weight: 800; 
      letter-spacing: 2px; 
      color: #ffffff;
    }

    .watchlist-scroll-area { 
      max-height: 700px; 
      overflow-y: auto; 
      padding-right: 5px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .watchlist-scroll-area::-webkit-scrollbar {
      width: 8px;
    }
    .watchlist-scroll-area::-webkit-scrollbar-track {
      background: #f0f0f3;
      border-radius: 4px;
    }
    .watchlist-scroll-area::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }

    /* Stile per i titoli delle sezioni */
    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 15px;
      letter-spacing: 1px;
      border-bottom: 2px solid #111111;
      padding-bottom: 5px;
      display: inline-block;
    }

    /* Griglia interna per ogni sezione */
    .watchlist-grid {
      column-count: 3;
      column-gap: 20px;
    }

    @media (max-width: 768px) {
      .watchlist-grid {
        column-count: 1;
      }
    }

    .watchlist-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      display: inline-block;
      width: 100%;
    }

    .watchlist-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: none;
      box-shadow: none;
      filter: none;
      transition: transform 0.3s ease;
      -webkit-touch-callout: none;
      pointer-events: auto;
    }

    .watchlist-item:hover .watchlist-img {
      transform: scale(1.02);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="site-wrapper">

    <header class="top-banner">
      <h1>WATCHLIST</h1>
      <a href="https://seea-star.github.io/Cosmic-S-Home/" style="background:#F3EEDA; color:#111; border:2px solid #111; padding:8px 14px; border-radius:12px; font-weight:800; font-size:0.75rem; text-decoration:none; box-shadow:2px 2px 0px #111;">← HOME</a>
    </header>

    <div class="watchlist-scroll-area">
      
      <!-- SEZIONE ANIME -->
      <div class="watchlist-section">
        <h2 class="section-title">ANIME</h2>
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./watchlist-01.png" alt="Naruto" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-02.png" alt="Spy x Family" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-03.png" alt="Saiki K" class="watchlist-img" oncontextmenu="return false;"></div>
          <div class="watchlist-item"><img src="./watchlist-04.png" alt="Attack on Titan" class="watchlist-img" oncontextmenu="return false;"></div>
        </div>
      </div>

      <!-- SEZIONE FILMS -->
      <div class="watchlist-section">
        <h2 class="section-title">FILMS</h2>
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./watchlist-05.png" alt="We Need to Talk About Kevin" class="watchlist-img" oncontextmenu="return false;"></div>
        </div>
      </div>

      <!-- SEZIONE SERIES (Puoi aggiungere altre sezioni così) -->
      <!--
      <div class="watchlist-section">
        <h2 class="section-title">SERIES</h2>
        <div class="watchlist-grid">
          <div class="watchlist-item"><img src="./tuo-file.png" alt="Series" class="watchlist-img"></div>
        </div>
      </div>
      -->

    </div>

  </div>

</body>
</html>
